name: 'EventV1 Verify'
description: 'Build the desk tool and require PASS, FAIL, and INDETERMINATE on committed ed25519-test fixtures. Not QuantumGuard. Not post-quantum.'
author: 'Operator Pages LLC'

inputs:
  seed:
    description: 'Ignored. Verify reads the public key in the fixture. This is not a PQC seed.'
    required: false
    default: ''
  vector_dir:
    description: 'Ignored. The proof uses the three committed fixtures.'
    required: false
    default: 'vectors/eventv1'

runs:
  using: 'composite'
  steps:
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'

    - name: Prove three verdicts
      shell: bash
      run: bash scripts/run-eventv1-verify.sh

    - name: jq envelope check
      shell: bash
      run: |
        if command -v jq >/dev/null; then
          for f in vectors/eventv1/*_envelope.json; do
            [ -f "$f" ] && jq empty "$f"
          done
        fi
