# Filename is historical. This job is ed25519-test, not post-quantum.
name: EventV1 local proof

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
  workflow_dispatch:

jobs:
  eventv1-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: EventV1 Verify
        uses: ./.github/actions/eventv1-verify

      - name: Upload vectors (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: eventv1-vectors
          path: vectors/eventv1/
          retention-days: 7
