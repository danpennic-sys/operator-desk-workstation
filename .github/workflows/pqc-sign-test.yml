# Filename is historical. Hosted runners do not HSM-sign. This is the same ed25519-test proof.
name: EventV1 hosted proof (no HSM)

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/**'
      - 'vectors/**'
      - '.github/actions/**'

jobs:
  hosted-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: EventV1 Verify (no HSM)
        uses: ./.github/actions/eventv1-verify

      - name: Note
        run: |
          echo "Hosted runner. No HSM. No post-quantum verification."
          echo "Self-hosted workflow does not sign either unless a separate signer is added."
