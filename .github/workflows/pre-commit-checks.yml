name: Pre-commit Checks (CI snippet)

on:
  pull_request:
  push:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Run pure-shell pre-commit logic
        env:
          REQUIRE_JQ: "1"
        run: |
          set -euo pipefail
          gofmt -l . | tee /tmp/gofmt.out
          if [ -s /tmp/gofmt.out ]; then
            echo "gofmt issues found"
            exit 1
          fi
          go vet ./...
          go test ./... -count=1 -short
          bash scripts/check-envelopes.sh
          echo "Pre-commit checks passed"

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
