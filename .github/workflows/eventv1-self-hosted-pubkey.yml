name: EventV1 self-hosted pubkey presence

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'tools/**'
      - 'vectors/**'

jobs:
  sign-hsm:
    runs-on: [self-hosted, signing, linux]
    steps:
      - uses: actions/checkout@v4

      - name: Check host signer public key
        run: |
          if [ ! -f /etc/host-signer/pubkey.hex ]; then
            echo "ERROR: /etc/host-signer/pubkey.hex not found on signer host"
            exit 1
          fi
          echo "Public key file is present. Presence is not a signature and is not a verdict."
          head -c 64 /etc/host-signer/pubkey.hex
          echo

      - name: EventV1 ed25519-test proof
        uses: ./.github/actions/eventv1-verify

      - name: Operator note
        run: |
          echo "This job did not HSM-sign an envelope."
          echo "eventv1 verify checked the committed ed25519-test fixtures only."
          echo "See docs/gate001/OPS_SIGNER_RUNBOOK.md before any production signing claim."
